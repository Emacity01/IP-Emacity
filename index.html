<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>International Press - Emacity</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: black;
    color: white;
    overflow: hidden;
}

body::before {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background:
        linear-gradient(to bottom, rgba(0,0,0,0.75), rgba(0,0,0,0.95)),
        url("https://images.unsplash.com/photo-1504711434969-e33886168f5c")
        no-repeat center/cover;
    z-index: -1;
}

.logoBox {
    position: absolute;
    top: 12px;
    left: 20px;
    font-size: 13px;
    letter-spacing: 2px;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
}

.liveBox {
    position: absolute;
    top: 12px;
    right: 20px;
    font-size: 13px;
    letter-spacing: 2px;
    background: rgba(0,0,0,0.6);
    padding: 6px 12px;
    border-left: 3px solid red;
}

.dot {
    height: 10px;
    width: 10px;
    background: red;
    border-radius: 50%;
    display: inline-block;
    margin-right: 6px;
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0% {transform: scale(1); opacity: 1;}
    50% {transform: scale(1.3); opacity: 0.6;}
    100% {transform: scale(1); opacity: 1;}
}

.onAir {
    margin-left: 8px;
    color: #ff4d4d;
    animation: fade 2s infinite;
}

@keyframes fade {
    0% {opacity: 1;}
    50% {opacity: 0.4;}
    100% {opacity: 1;}
}

.headline {
    position: absolute;
    top: 110px;
    width: 100%;
    text-align: center;
    font-size: 44px;
    font-weight: bold;
    opacity: 0;
    transform: translateY(15px);
    transition: 1s;
}

button {
    position: absolute;
    top: 190px;
    left: 50%;
    transform: translateX(-50%);
    padding: 14px 30px;
    font-size: 16px;
    background: red;
    border: none;
    color: white;
    cursor: pointer;
}

.card {
    position: absolute;
    top: 270px;
    width: 100%;
    text-align: center;
    opacity: 0;
    transition: 1s;
    font-size: 22px;
    line-height: 1.6;
}

.highlight {
    color: #00c3ff;
    font-weight: bold;
    font-size: 24px;
}

.flash {
    position: fixed;
    width: 180px;
    height: 180px;
    background: radial-gradient(circle, rgba(255,255,255,0.5), transparent);
    opacity: 0;
    pointer-events: none;
}

@keyframes softFlash {
    0% {opacity: 0;}
    20% {opacity: 0.5;}
    100% {opacity: 0;}
}
</style>
</head>

<body>

<div class="logoBox">EMACITY NEWS</div>

<div class="liveBox">
<span class="dot"></span> LIVE • <span id="time"></span>
<span class="onAir">ON AIR</span>
</div>

<div id="headline" class="headline">PRESS ACCESS GRANTED</div>

<button onclick="start()">ENTER NEWSROOM</button>

<div id="card" class="card">
<p id="roleLine"></p>
<p id="agencyLine"></p>
<br>
<p>You are now live.</p>
<p>The story begins with you.</p>
</div>

<audio id="click" src="https://www.soundjay.com/button/sounds/button-09.mp3"></audio>

<script>
// 🔐 PASSKEY DATABASE
const database = {
    "PRESS01": { role: "Journalist", name: "Aarav Mehta", agency: "Reuters" },
    "PRESS02": { role: "Photographer", name: "Riya Sharma" }
};

let currentUser = null;

while(!currentUser){
    let key = prompt("Enter Press Passkey:");
    if(database[key]){
        currentUser = database[key];
    } else {
        alert("Invalid Passkey. Access Denied.");
    }
}

function updateTime() {
    let now = new Date();
    let time = now.toLocaleTimeString("en-IN", {
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit'
    });
    document.getElementById("time").textContent = time + " IST";
}
setInterval(updateTime, 1000);
updateTime();

function createFlash() {
    let flash = document.createElement("div");
    flash.className = "flash";
    flash.style.top = Math.random() * 80 + "%";
    flash.style.left = Math.random() * 80 + "%";
    flash.style.animation = "softFlash 0.8s ease";
    document.body.appendChild(flash);
    setTimeout(() => flash.remove(), 800);
}

function start() {
    document.getElementById("click").play().catch(()=>{});

    let msg = new SpeechSynthesisUtterance(
        "Live from Emacity Model United Nations. Press access granted."
    );
    speechSynthesis.speak(msg);

    document.getElementById("headline").style.opacity = 1;
    document.getElementById("headline").style.transform = "translateY(0)";

    document.getElementById("roleLine").innerHTML =
        currentUser.role + ": <span class='highlight'>" + currentUser.name + "</span>";

    if(currentUser.role === "Journalist"){
        document.getElementById("agencyLine").innerHTML =
            "Agency: <span class='highlight'>" + currentUser.agency + "</span>";
    }

    setInterval(createFlash, 1400);

    setTimeout(() => {
        document.getElementById("card").style.opacity = 1;
    }, 1200);
}
</script>

</body>
</html>
