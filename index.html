<script>
"use strict";

/* LIVE CLOCK */
setInterval(()=>{
 document.getElementById("time").textContent =
 new Date().toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata"})+" IST";
},1000);

/* ===== REAL DATABASE (clean, complete) ===== */
const pressDB = {
"PRESS01": { name:"Swanandi Santosh Swami", role:"Photographer 1" },
"PRESS02": { name:"Ishaan Singh", role:"Photographer 2" },
"PRESS03": { name:"Trisha Kashyap", role:"Photographer 3" },
"PRESS04": { name:"Hridaan Chhabra", role:"Photographer 4" },
"PRESS05": { name:"Yashvi Bajpayee", role:"Photographer 5" },
"PRESS06": { name:"Agastyaa Saurabh Soni", role:"Photographer 6" },
"PRESS07": { name:"Titiksha Mulay", role:"Photographer 7" },
"PRESS08": { name:"Sudhisha Gawande", role:"Journalist 1" },
"PRESS09": { name:"Titiksha Mulay", role:"Journalist 2" },
"PRESS10": { name:"Kaavin Arora", role:"Journalist 3" },
"PRESS11": { name:"Megh Dawara", role:"Journalist 4" },
"PRESS12": { name:"Aarohi Anturkar", role:"Journalist 5" },
"PRESS13": { name:"Aanya Chauhan", role:"Journalist 6" },
"PRESS14": { name:"Kannkshita Shetty", role:"Journalist 7" },
"ARM11":  { name:"Armeya", role:"Head of IP" }
};

/* formatter */
function normalizeKey(val){
  val = val.toUpperCase().replace(/\s/g,'');
  if(val.startsWith("PRESS")){
    let num = val.replace(/\D/g,'');
    if(num.length===1) num="0"+num;
    return "PRESS"+num;
  }
  return val;
}

document.getElementById("passkey").addEventListener("keydown",e=>{
  if(e.key==="Enter") verify();
});

function verify(){
 const err=document.getElementById("error");
 err.style.display="none";

 let raw=document.getElementById("passkey").value.trim();
 let key=normalizeKey(raw);

 if(pressDB[key]){
   let data=pressDB[key];
   document.getElementById("name").innerText=data.name;
   document.getElementById("role").innerText=data.role;
   document.getElementById("login").style.display="none";
   startEffects();
 }else{
   err.style.display="block";
   setTimeout(()=>err.style.display="none",2000);
 }
}

/* effects */
function startEffects(){
 document.getElementById("click").play().catch(()=>{});
 let headline=document.getElementById("headline");
 headline.style.opacity=1;
 headline.style.transform="translateY(0)";
 setInterval(createFlash,1400);
 setTimeout(()=>{
   document.getElementById("card").style.opacity=1;
 },1200);
}

function createFlash(){
 let flash=document.createElement("div");
 flash.className="flash";
 flash.style.top=Math.random()*80+"%";
 flash.style.left=Math.random()*80+"%";
 flash.style.animation="softFlash .8s ease";
 document.body.appendChild(flash);
 setTimeout(()=>flash.remove(),800);
}
</script>
