<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IP Press Access • Emacity MUN</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">

<style>
body{
  margin:0;
  font-family:Inter, sans-serif;
  background:#0b0f1a;
  color:white;
  text-align:center;
  overflow:hidden;
}
#time{
  position:fixed;
  top:20px;
  right:30px;
  opacity:.6;
  font-weight:600;
}
#login{
  position:absolute;
  top:50%;
  left:50%;
  transform:translate(-50%,-50%);
}
input{
  padding:14px 18px;
  font-size:18px;
  border-radius:8px;
  border:none;
  width:260px;
  text-align:center;
}
button{
  margin-top:15px;
  padding:10px 20px;
  border:none;
  border-radius:6px;
  font-weight:600;
  cursor:pointer;
}
#error{
  color:#ff4d4d;
  margin-top:10px;
  display:none;
}
#headline{
  opacity:0;
  transform:translateY(-30px);
  transition:1s ease;
  font-size:30px;
  font-weight:800;
  margin-top:80px;
}
#card{
  opacity:0;
  transition:1s ease;
  margin-top:40px;
  padding:30px;
  border-radius:12px;
  background:rgba(255,255,255,0.05);
  display:inline-block;
  min-width:320px;
}
.flash{
  position:fixed;
  width:120px;
  height:120px;
  background:radial-gradient(circle,rgba(255,255,255,.9),transparent);
  border-radius:50%;
  pointer-events:none;
}
@keyframes softFlash{
  from{opacity:.9}
  to{opacity:0}
}
</style>
</head>

<body>

<div id="time"></div>

<div id="login">
  <h2>Enter Press Passkey</h2>
  <input id="passkey" placeholder="PRESS01">
  <br>
  <button id="btn">Access</button>
  <div id="error">Invalid Passkey</div>
</div>

<div id="headline">PRESS ACCESS GRANTED</div>

<div id="card">
  <h2 id="name"></h2>
  <p id="role"></p>
</div>

<audio id="click" src="https://assets.mixkit.co/active_storage/sfx/2571/2571-preview.mp3"></audio>

<script>
document.addEventListener("DOMContentLoaded", function(){

/* Clock */
setInterval(function(){
  var t=document.getElementById("time");
  if(t){
    t.textContent=new Date().toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata"})+" IST";
  }
},1000);

/* Database */
var pressDB={
"PRESS01":{name:"Swanandi Santosh Swami",role:"Photographer 1"},
"PRESS02":{name:"Ishaan Singh",role:"Photographer 2"},
"PRESS03":{name:"Trisha Kashyap",role:"Photographer 3"},
"PRESS04":{name:"Hridaan Chhabra",role:"Photographer 4"},
"PRESS05":{name:"Yashvi Bajpayee",role:"Photographer 5"},
"PRESS06":{name:"Agastyaa Saurabh Soni",role:"Photographer 6"},
"PRESS07":{name:"Titiksha Mulay",role:"Photographer 7"},
"PRESS08":{name:"Sudhisha Gawande",role:"Journalist 1"},
"PRESS09":{name:"Titiksha Mulay",role:"Journalist 2"},
"PRESS10":{name:"Kaavin Arora",role:"Journalist 3"},
"PRESS11":{name:"Megh Dawara",role:"Journalist 4"},
"PRESS12":{name:"Aarohi Anturkar",role:"Journalist 5"},
"PRESS13":{name:"Aanya Chauhan",role:"Journalist 6"},
"PRESS14":{name:"Kannkshita Shetty",role:"Journalist 7"},
"ARM11":{name:"Armeya",role:"Head of IP"}
};

function normalizeKey(v){
  v=v.toUpperCase().replace(/\s/g,'');
  if(v.indexOf("PRESS")===0){
    var num=v.replace(/\D/g,'');
    if(num.length===1) num="0"+num;
    return "PRESS"+num;
  }
  return v;
}

function verify(){
  var err=document.getElementById("error");
  err.style.display="none";

  var raw=document.getElementById("passkey").value.trim();
  var key=normalizeKey(raw);

  if(pressDB[key]){
    var d=pressDB[key];
    document.getElementById("name").innerText=d.name;
    document.getElementById("role").innerText=d.role;
    document.getElementById("login").style.display="none";
    startEffects();
  }else{
    err.style.display="block";
    setTimeout(function(){err.style.display="none";},2000);
  }
}

document.getElementById("btn").onclick=verify;
document.getElementById("passkey").addEventListener("keydown",function(e){
  if(e.key==="Enter") verify();
});

function startEffects(){
  var click=document.getElementById("click");
  if(click) click.play().catch(function(){});

  var h=document.getElementById("headline");
  h.style.opacity=1;
  h.style.transform="translateY(0)";

  setInterval(createFlash,1400);

  setTimeout(function(){
    document.getElementById("card").style.opacity=1;
  },1200);
}

function createFlash(){
  var f=document.createElement("div");
  f.className="flash";
  f.style.top=Math.random()*80+"%";
  f.style.left=Math.random()*80+"%";
  document.body.appendChild(f);
  setTimeout(function(){f.remove();},800);
}

});
</script>

</body>
</html>
