<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>International Press • Emacity MUN</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap" rel="stylesheet">

<style>
*{margin:0;padding:0;box-sizing:border-box}

body{
  font-family:Inter, sans-serif;
  height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  background:linear-gradient(135deg,#0f172a,#020617);
  color:white;
  overflow:hidden;
  position:relative;
}

/* animated aura FIXED */
body::before{
  content:"";
  position:absolute;
  inset:0;
  background:radial-gradient(circle at 30% 30%,#3b82f6,transparent 60%);
  filter:blur(140px);
  animation:move 14s infinite alternate ease-in-out;
  z-index:0;
}
@keyframes move{
  from{transform:translate(-200px,-150px)}
  to{transform:translate(200px,150px)}
}

/* ensure content always above aura */
.wrapper{
  position:relative;
  z-index:2;
  width:100%;
  text-align:center;
}

/* top title */
.top{
  position:absolute;
  top:40px;
  width:100%;
}

#title{
  font-size:28px;
  font-weight:800;
  letter-spacing:3px;
  height:36px;
}

.subtitle{
  margin-top:6px;
  opacity:.7;
  letter-spacing:4px;
  font-size:12px;
}

#clock{
  position:absolute;
  top:40px;
  right:40px;
  opacity:.6;
  font-weight:600;
  z-index:3;
}

/* card */
.card{
  margin:auto;
  width:380px;
  padding:45px;
  border-radius:24px;
  backdrop-filter:blur(25px);
  background:rgba(255,255,255,0.06);
  box-shadow:0 30px 80px rgba(0,0,0,.7);
  text-align:center;
  transform:translateY(20px);
  animation:float 2s ease forwards;
}
@keyframes float{
  to{transform:translateY(0)}
}

input{
  width:100%;
  padding:14px;
  border:none;
  border-radius:12px;
  margin-bottom:18px;
  font-size:16px;
  text-align:center;
  outline:none;
}

button{
  width:100%;
  padding:13px;
  border:none;
  border-radius:12px;
  font-weight:700;
  cursor:pointer;
  background:white;
  transition:.2s;
}
button:hover{transform:scale(1.03)}

#error{
  color:#f87171;
  margin-top:14px;
  display:none;
  font-size:14px;
}

.result{
  margin-top:30px;
  opacity:0;
  transform:translateY(25px);
  transition:.6s ease;
}
.result.show{
  opacity:1;
  transform:translateY(0);
}
.name{
  font-size:22px;
  font-weight:700;
}
.role{
  opacity:.7;
  margin-top:6px;
}
</style>
</head>
<body>

<div class="top">
  <div id="title"></div>
  <div class="subtitle">INTERNATIONAL PRESS</div>
</div>

<div id="clock"></div>

<div class="wrapper">
  <div class="card">
    <input id="key" placeholder="Enter Press Passkey" onkeydown="if(event.key==='Enter')verify()">
    <button onclick="verify()">Access</button>
    <div id="error">Invalid Passkey</div>

    <div class="result" id="result">
      <div class="name" id="name"></div>
      <div class="role" id="role"></div>
    </div>
  </div>
</div>

<script>
/* Typing effect */
const text="EMACITY MODEL UNITED NATIONS";
let i=0;
function type(){
  if(i<text.length){
    document.getElementById("title").innerHTML+=text.charAt(i);
    i++;
    setTimeout(type,50);
  }
}
type();

/* Clock IST */
setInterval(()=>{
  document.getElementById("clock").textContent =
    new Date().toLocaleTimeString("en-IN",{timeZone:"Asia/Kolkata"})+" IST";
},1000);

/* DB */
const db={
"PRESS01":{name:"Swanandi Santosh Swami",role:"Photographer"},
"PRESS02":{name:"Ishaan Singh",role:"Photographer"},
"PRESS03":{name:"Trisha Kashyap",role:"Photographer"},
"PRESS04":{name:"Hridaan Chhabra",role:"Photographer"},
"PRESS05":{name:"Yashvi Bajpayee",role:"Photographer"},
"PRESS06":{name:"Vaani Bharadwaj",role:"Journalist"},
"PRESS07":{name:"Titiksha Mulay",role:"Photographer"},
"PRESS08":{name:"Sudhisha Gawande",role:"Journalist"},
"PRESS09":{name:"Titiksha Mulay",role:"Journalist"},
"PRESS10":{name:"Kaavin Arora",role:"Journalist"},
"PRESS11":{name:"Megh Dawara",role:"Journalist"},
"PRESS12":{name:"Aarohi Anturkar",role:"Journalist"},
"PRESS13":{name:"Aanya Chauhan",role:"Journalist"},
"PRESS14":{name:"Kannkshita Shetty",role:"Journalist"},
"PRESS15":{name:"Shriya Rajan",role:"Journalist"},
"ARM11":{name:"Armeya",role:"Head of IP"}
};

function normalize(k){
  k=k.toUpperCase().replace(/\s/g,'');
  if(k.startsWith("PRESS")){
    let n=k.replace(/\D/g,'');
    if(n.length===1)n="0"+n;
    return "PRESS"+n;
  }
  return k;
}

function verify(){
  let key=normalize(document.getElementById("key").value);
  let err=document.getElementById("error");
  let res=document.getElementById("result");
  err.style.display="none";

  if(db[key]){
    document.getElementById("name").innerText=db[key].name;
    document.getElementById("role").innerText=db[key].role;
    res.classList.add("show");
  }else{
    res.classList.remove("show");
    err.style.display="block";
  }
}
</script>

</body>
</html>
